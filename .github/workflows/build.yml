name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repository ships no gradle-wrapper.jar (it is a binary), so Gradle is
      # provisioned here and invoked directly. Running `gradle wrapper` locally, or
      # opening the project in Android Studio once, generates the wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        shell: bash
        run: set -o pipefail; gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Assemble debug APK
        shell: bash
        run: set -o pipefail; gradle --no-daemon :app:assembleDebug :companion:assembleDebug 2>&1 | tee -a build.log

      # Surface compiler / test errors as annotations (readable through the checks API).
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|expected:<|What went wrong" -A2 build.log \
            | grep -v "^--$" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -o 'testcase name="[^"]*"[^>]*>\s*<failure message="[^"]*' "$f" 2>/dev/null | head -10 \
              | while IFS= read -r l; do echo "::error::$l"; done
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: car-companion
          path: companion/build/outputs/apk/debug/companion-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  release:
    name: Publish release APK
    needs: build
    # Publishes on a v* tag, or automatically on every push to main: the tag is taken from
    # versionName in app/build.gradle.kts, so bumping the version and merging = a release.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            echo "name=v${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Signing is optional so early tags can still publish something installable.
      # Once KEYSTORE_BASE64 exists this switches to a properly signed build with no
      # further edits. NOTE: the in-app updater can only replace a build signed with the
      # SAME key, so debug-signed releases cannot be upgraded in place.
      - name: Detect signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret - publishing a debug-signed APK. The in-app updater cannot upgrade in place until releases are signed with a stable key."
          fi

      - name: Restore signing keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Assemble signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/car-launcher-${{ steps.tag.outputs.name }}.apk"

      - name: Assemble debug APK (unsigned release fallback)
        if: steps.signing.outputs.signed != 'true'
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/car-launcher-${{ steps.tag.outputs.name }}-debug.apk"

      # Phone companion app ships in the same release (the launcher's updater skips it).
      - name: Assemble companion APK
        run: |
          gradle --no-daemon :companion:assembleDebug
          mkdir -p dist
          cp companion/build/outputs/apk/debug/companion-debug.apk \
             "dist/car-companion-${{ steps.tag.outputs.name }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ startsWith(steps.tag.outputs.name, 'v0.') }}
          body: |
            ${{ steps.signing.outputs.signed == 'true' && 'Signed release build.' || 'Signed with the project''s fixed debug key: installs over any previous build from this repo, and the in-app updater can upgrade to it.' }}

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties
